services:
  - type: web
    name: proyecto-universidad-proxy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Origen del contenido real: la URL .vercel.app que Vercel YA le dio a tu
      # proyecto (no es un subdominio nuevo de tu dominio). Reemplaza el valor
      # por la tuya: la encuentras en Vercel -> proyecto -> Domains.
      - key: TARGET
        value: https://alexa-marin-sales-page.vercel.app
      # Origen del clon en Vercel (alexandramarinbr.com y
      # evento.alexandramarinbr.com). Vacio = usa TARGET.
      - key: ORIGIN_BR
        value: ""
      # Enlace de WhatsApp para alexandramarinbr.com (pagina /gracias).
      # Si lo defines, el proxy reemplaza el original en HTML y JS.
      - key: WHATSAPP_BR
        value: ""
      # Latencia de carga de la pagina (ms). 0 = sin retraso.
      - key: SERVER_DELAY_MS
        value: "0"
      # Duracion del overlay "Cargando..." al enviar el formulario (ms).
      - key: FORM_DELAY_MS
        value: "30000"
      # A donde redirigir tras la carga lenta (siguiente paso del embudo).
      - key: REDIRECT_TO
        value: /unirse-al-grupo
      # --- Cuando aparece la carga lenta -------------------------------------
      # Interruptor maestro (apaga TODO): true/false
      - key: SLOW_ENABLED
        value: "true"
      # Flag del horario nocturno: true/false
      - key: SLOW_SCHEDULE_ENABLED
        value: "true"
      # Franja horaria (hora Colombia) HH:MM
      - key: SLOW_START
        value: "20:00"
      - key: SLOW_END
        value: "07:30"
      - key: SLOW_TZ
        value: America/Bogota
      # Flag del azar y su probabilidad (%)
      - key: SLOW_RANDOM_ENABLED
        value: "true"
      - key: SLOW_RANDOM_PERCENT
        value: "30"
